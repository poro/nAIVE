name: Release

# Bump the version in a pull request (scripts/bump-version.sh). When it merges,
# this workflow sees the new version on master, builds and checks it, and only
# then tags the commit vX.Y.Z and releases it. A failed check leaves no tag:
# re-run the workflow if the failure was flaky; otherwise merge the fix and
# push the vX.Y.Z tag on that master commit by hand, which also releases.

on:
  push:
    branches: [master]
    # Only version bumps can start a release from master. (Path filters do
    # not apply to tag pushes.)
    paths: [Cargo.toml]
    tags: ["v*"]

permissions:
  contents: read

# One release at a time: a second push touching Cargo.toml while a release is
# building waits instead of racing it for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Keep in step with ci.yml, the README and the Homebrew formula.
  SLANG_VERSION: "2026.2.2"
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  verify:
    name: Decide
    runs-on: ubuntu-latest
    # Tagging waits for the build and checks (publish job).
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version, tag and master
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v${version}"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            # A push to master that touched Cargo.toml: release only if this
            # version has no tag yet.
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "${tag} already exists; nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::$GITHUB_REF_NAME is not on master; release from a merged commit"
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: Build and package (macOS)
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Optional. Without them the demo app is signed ad hoc, which other
      # Macs refuse to open when downloaded. See docs/DEVELOPMENT.md.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install SLANG SDK
        run: |
          mkdir -p vendor
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-macos-aarch64.tar.gz" \
            | tar xz -C vendor

      - name: Verify workspace tests
        run: cargo test --workspace --exclude naive-web --locked

      - name: Build naive (with Slang)
        run: cargo build --release --locked -p naive-runtime --bins

      # On its own, so feature unification cannot link Slang into it.
      - name: Build naive-player (without Slang)
        run: |
          cargo build --release --locked -p naive-player
          if otool -L target/release/naive-player | grep -i slang; then
            echo "::error::naive-player links a Slang library"
            exit 1
          fi

      - name: Verify Slang to standalone player rendering
        run: python3 scripts/release-smoke.py --no-build --slang

      - name: Bundle the demo project
        working-directory: project
        run: ../target/release/naive build

      - name: Sign with Developer ID and notarize
        if: env.MACOS_CERTIFICATE != '' && env.APPLE_ID != ''
        run: |
          app=$(ls -d project/dist/*.app)
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"

      # Publish depends on this job: exercise the final app after signing and
      # notarization, away from the source project, before attaching any assets.
      - name: Launch and verify relocated release app
        run: |
          app=$(ls -d project/dist/*.app)
          python3 scripts/release-smoke.py --bundle "$app"

      - name: Package
        run: |
          app=$(ls -d project/dist/*.app)
          name=$(basename "$app" .app)
          mkdir -p release
          ditto -c -k --keepParent "$app" "release/nAIVE-demo-${name}-${VERSION}-macos-arm64.zip"
          tar -C target/release -czf "release/naive-player-${VERSION}-macos-arm64.tar.gz" naive-player
          (cd release && shasum -a 256 * > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, macos]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Git LFS files are needed: include_bytes! embeds LFS-tracked meshes.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: release

      # Homebrew builds from source. GitHub's own source archives can hold
      # Git LFS pointer files instead of the meshes include_bytes! embeds, so
      # the release carries its own source tarball with the real files.
      - name: Source tarball with Git LFS files
        id: source
        run: |
          name="nAIVE-${VERSION}"
          mkdir -p stage
          git archive --format=tar --prefix="${name}/" HEAD | tar -x -C stage
          git lfs ls-files --name-only | while IFS= read -r file; do
            cp "$file" "stage/${name}/${file}"
          done
          mesh="stage/${name}/project/assets/meshes/meshy_car.glb"
          # An LFS pointer is a ~130-byte text file; the real mesh is megabytes.
          if [ "$(wc -c < "$mesh")" -lt 4096 ]; then
            echo "::error::$mesh is still a Git LFS pointer"
            exit 1
          fi
          tarball="${name}-source.tar.gz"
          tar -C stage -czf "release/${tarball}" "$name"
          rm -f release/SHA256SUMS
          (cd release && sha256sum -- *) > SHA256SUMS && mv SHA256SUMS release/
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "release/${tarball}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Tag the release commit
        if: github.ref_type == 'branch'
        run: |
          # Only now that every check passed. Pushed with the workflow token,
          # so it does not start this workflow again.
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Create release
        run: |
          gh release create "$TAG" release/* \
            --verify-tag --title "nAIVE $TAG" --generate-notes
          {
            echo "### Homebrew formula"
            echo "url \"${{ steps.source.outputs.url }}\""
            echo "sha256 \"${{ steps.source.outputs.sha256 }}\""
          } >> "$GITHUB_STEP_SUMMARY"
