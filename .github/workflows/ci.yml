name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Naming bash turns on pipefail, so a failed download fails the step.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Keep in step with the README and the Homebrew formula.
  SLANG_VERSION: "2026.2.2"
  # Pinned because clippy warnings fail the build: a newer clippy can add
  # lints, and that should not break CI without a code change. Bump on purpose.
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all -- --check
      - name: Agent benchmark reporting regressions (no model calls)
        run: python3 -m unittest discover -s scripts/agent-benchmark -p 'test_*.py' -v
      # naive-sim is the GPU-free simulation shared with headless tests, a
      # server and the web build (docs/sim-split-plan.md).
      - name: naive-sim stays free of GPU, window and audio crates
        run: |
          check_sim_dependencies() {
            sim_dependencies=$(cargo tree --locked -p naive-sim -e normal --prefix none "$@")
            if printf '%s\n' "$sim_dependencies" | grep -E '^(wgpu|winit|kira|cpal|shader-slang)'; then
              echo "naive-sim depends on a GPU, window or audio crate"
              exit 1
            fi
          }
          check_sim_dependencies --no-default-features
          check_sim_dependencies --no-default-features --features scripting

  no-slang:
    name: Test without Slang SDK
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Standalone simulation with and without Lua
        run: |
          cargo test --locked -p naive-sim --no-default-features
          cargo test --locked -p naive-sim --no-default-features --features scripting
      - run: cargo test --workspace --exclude naive-web --no-default-features --locked
      - run: cargo clippy --workspace --exclude naive-web --all-targets --no-default-features --locked -- -D warnings
      - name: Scene tests without Slang
        working-directory: project
        run: cargo run --locked -p naive-runtime --no-default-features --bin naive -- test

  test-macos:
    name: Test and lint (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      # .cargo/config.toml points SLANG_DIR and the runtime library path at vendor/.
      - name: Install SLANG SDK
        run: |
          mkdir -p vendor
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-macos-aarch64.tar.gz" \
            | tar xz -C vendor

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace --exclude naive-web --locked

      # Game bundles ship naive-player, which must run without the Slang SDK.
      # It is built on its own: building it with the workspace would unify
      # naive-runtime's default slang feature into it.
      - name: naive-player links no Slang library
        run: |
          cargo build --locked -p naive-player
          if otool -L target/debug/naive-player | grep -i slang; then
            echo "naive-player links a Slang library"
            exit 1
          fi

      # Headless Lua tests of the demo scenes. They need no GPU or window.
      - name: Scene tests
        working-directory: project
        run: cargo run --locked -p naive-runtime --bin naive -- test

      # Any warning fails the build, in test code too.
      - name: Clippy
        run: cargo clippy --workspace --exclude naive-web --all-targets --locked -- -D warnings

  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libclang-dev pkg-config \
            mesa-vulkan-drivers xvfb

      - name: Install SLANG SDK
        run: |
          mkdir -p vendor
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" \
            | tar xz -C vendor

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --exclude naive-web --locked

      - name: Native/headless parity (software Vulkan)
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo test --locked -p naive-client --lib --no-default-features scene_snapshot::parity_tests::native_gpu_caches_match_headless_snapshot -- --ignored --exact
          cargo test --locked -p naive-client --lib --no-default-features lifecycle_parity_tests::native_lifecycle_matches_headless_runner -- --ignored --exact

      - name: Standalone release smoke test (software Vulkan)
        env:
          WGPU_BACKEND: vulkan
          RUST_BACKTRACE: "1"
        run: |
          xvfb-run -a python3 scripts/release-smoke.py
          xvfb-run -a python3 scripts/release-smoke.py --slang

      # Uses the Slang-enabled release binary the second smoke mode built.
      - name: Demo scenes build, render and capture repeatably (software Vulkan)
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a python3 scripts/scene-check.py

  check-web:
    name: Check (WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with the wasm target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Check naive-web
        run: cargo check -p naive-web --target wasm32-unknown-unknown --locked
      - name: Check default simulation without Lua
        run: cargo check --locked -p naive-sim --no-default-features --target wasm32-unknown-unknown
