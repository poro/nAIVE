[env]
# SLANG SDK root — used by shader-slang-sys build script to find headers & libs.
# Points to the vendored SLANG distribution at <project>/vendor/.
SLANG_DIR = { value = "vendor", relative = true }

# The runtime library search path (rpath) for the SLANG shared libraries is
# added by the build scripts of naive-client and naive-runtime, which turn
# SLANG_DIR into an absolute path at build time. It is not set here because
# rustflags cannot refer to the workspace directory, and a path relative to
# the executable breaks whenever cargo changes where it puts binaries.
