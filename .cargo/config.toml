[env]
# SLANG SDK root — used by shader-slang-sys build script to find headers & libs.
# Points to the vendored SLANG distribution at <project>/vendor/.
SLANG_DIR = { value = "vendor", relative = true }

[target.'cfg(target_os = "macos")']
# Add vendor/lib to the runtime library search path (rpath) so the binary
# can find libslang-compiler and other SLANG shared libraries at runtime.
# The paths are relative to the executable, so they work wherever the repo is
# cloned: the first covers target/<profile>/naive, the second covers test
# binaries in target/<profile>/deps/.
rustflags = [
    "-C", "link-arg=-Wl,-rpath,@executable_path/../../vendor/lib",
    "-C", "link-arg=-Wl,-rpath,@executable_path/../../../vendor/lib",
]
