[package]
name = "naive-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "nAIVE client — renderer, physics, scripting, audio, input"

[features]
default = ["slang"]
slang = ["dep:shader-slang"]

[dependencies]
naive-core = { workspace = true }

# GPU rendering
wgpu = { workspace = true }
winit = { workspace = true }

# SLANG shader compilation (optional)
shader-slang = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_norway = { workspace = true }
serde_json = { workspace = true }

# File watching
notify = { workspace = true }

# Math
glam = { workspace = true }

# Logging
tracing = { workspace = true }

# CLI
clap = { workspace = true }

# Async bridging
pollster = { workspace = true }

# Byte casting
bytemuck = { workspace = true }

# ECS
hecs = { workspace = true }

# Asset loading
gltf = { workspace = true }
image = { workspace = true }
ply-rs = { workspace = true }
stl_io = { workspace = true }
linked-hash-map = { workspace = true }

# Physics
rapier3d = { workspace = true }

# Scripting
mlua = { workspace = true }

# Audio
kira = { workspace = true }

# Async / IPC
tokio = { workspace = true }
libc = "0.2"

# HTTP client (for submit-log)
ureq = { workspace = true }

# Date/time (for submit-log timestamp)
chrono = { workspace = true }

# Base64 encoding (for beautify API)
base64 = { workspace = true }

[dev-dependencies]
# Validates the engine's built-in WGSL without a GPU. Same version wgpu uses.
naga = { version = "30", features = ["wgsl-in"] }
