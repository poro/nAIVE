[package]
name = "naive-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "nAIVE CPU simulation, asset decoding and presentation contracts without a GPU or window"

# Must never depend on wgpu, winit or an audio backend: CI checks it. It is
# what headless tests, a future server and the web build share with the
# engine. See docs/sim-split-plan.md.

[features]
default = []
# Native Lua VM and headless runner; keep the default CPU library usable on wasm.
scripting = ["dep:mlua"]
# Asset-free schema fixtures used by cross-crate unit tests, never runtime loads.
test-support = []

[dependencies]
naive-core = { workspace = true }
glam = { workspace = true }
hecs = { workspace = true }
rapier3d = { workspace = true }
gltf = { workspace = true }
stl_io = { workspace = true }
ply-rs = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
bytemuck = { workspace = true }
mlua = { workspace = true, optional = true }
