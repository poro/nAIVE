events:
  player.damaged:
    description: "Player took damage"
    fields:
      - amount
      - source
  player.died:
    description: "Player health reached zero"
    fields: []
  player.interacted:
    description: "Player pressed interact"
    fields: []
  player.attacked:
    description: "Player pressed attack"
    fields: []
  door.opened:
    description: "A door was opened"
    fields:
      - door_id
  item.collected:
    description: "Player collected an item"
    fields:
      - item_id
      - item_type
  enemy.defeated:
    description: "An enemy was defeated"
    fields:
      - enemy_id
  game.level_complete:
    description: "The level was completed"
    fields: []
  swarm.kills:
    description: "Members of a GPU swarm were killed (reported a frame or two late)"
    fields:
      - swarm
      - count
      - alive
  swarm.hit:
    description: "Members of a GPU swarm attacked their target"
    fields:
      - swarm
      - target
      - hits
      - damage
  swarm.cleared:
    description: "A GPU swarm's last members died and no spawns are on the way"
    fields:
      - swarm
  havoc.wave_started:
    description: "HAVOC prototype: a wave was spawned"
    fields:
      - wave
      - count
  havoc.wave_cleared:
    description: "HAVOC prototype: every goblin of the wave is dead"
    fields:
      - wave
