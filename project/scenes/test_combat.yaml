name: "Combat Test"
settings:
  ambient_light: [0.2, 0.2, 0.3]
  gravity: [0, -9.81, 0]

# A fixture for tests/test_combat.lua rather than a demo. Two weights fall onto
# a target that has health: the light one hurts it, the heavy one kills it.
entities:
  - id: camera
    components:
      transform:
        position: [0, 3, 8]
      camera:
        fov: 60
        near: 0.1
        far: 100
        role: main

  - id: light
    components:
      transform:
        position: [4, 8, 4]
      point_light:
        color: [1, 1, 1]
        intensity: 20
        range: 30

  # No rigid_body, so the collider is static.
  - id: target
    components:
      transform:
        position: [0, 0.5, 0]
      mesh_renderer:
        mesh: procedural:sphere
        material: procedural:default
      collider: { shape: sphere, radius: 0.5 }
      health: { max: 30 }
      script: { source: logic/test_combat_target.lua }

  # Reaches the target after about 0.6 s.
  - id: light_weight
    components:
      transform:
        position: [0, 3, 0]
        scale: [0.6, 0.6, 0.6]
      mesh_renderer:
        mesh: procedural:sphere
        material: procedural:default
      rigid_body: { body_type: dynamic, mass: 1.0 }
      collider: { shape: sphere, radius: 0.3 }
      collision_damage: { damage: 10, destroy_on_hit: true }

  # Reaches the target after about 1.5 s.
  - id: heavy_weight
    components:
      transform:
        position: [0, 12, 0]
        scale: [0.6, 0.6, 0.6]
      mesh_renderer:
        mesh: procedural:sphere
        material: procedural:default
      rigid_body: { body_type: dynamic, mass: 1.0 }
      collider: { shape: sphere, radius: 0.3 }
      collision_damage: { damage: 100, destroy_on_hit: true }
