[workspace]
resolver = "2"
members = [
    "crates/naive-core",
    "crates/naive-sim",
    "crates/naive-client",
    "crates/naive-runtime",
    "crates/naive-server",
    "crates/naive-web",
    "crates/naive-player",
]
# `cargo build` at the root builds these. naive-web only builds for wasm32, and
# naive-player must be built on its own so it stays free of Slang (see its
# Cargo.toml).
default-members = [
    "crates/naive-core",
    "crates/naive-sim",
    "crates/naive-client",
    "crates/naive-runtime",
    "crates/naive-server",
]

[workspace.package]
version = "0.1.23"
edition = "2021"
# Required by the audited dependency lockfile (image/ICU need 1.88).
rust-version = "1.88"

[workspace.dependencies]
# Math
glam = "0.34"

# ECS
hecs = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
# Maintained fork of the deprecated serde_yaml, same API and parser.
serde_norway = "0.9"
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GPU rendering
wgpu = { version = "30", features = ["spirv"] }
winit = "0.30"

# SLANG shader compilation
shader-slang = { version = "0.1" }

# CLI
clap = { version = "4", features = ["derive"] }

# File watching
notify = "7"

# Async bridging
pollster = "0.4"

# Byte casting
bytemuck = { version = "1", features = ["derive"] }

# Asset loading
gltf = "1.4"
image = "0.25"
ply-rs = "0.1.3"
stl_io = "0.7"
linked-hash-map = "0.5.6"

# Physics
# SIMD is built in since 0.23 (the simd-stable feature is gone).
rapier3d = "0.36"

# Scripting
memchr = "2"
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }

# Audio
kira = { version = "0.12.6", default-features = false, features = ["cpal", "mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }

# HTTP client (for submit-log)
ureq = { version = "2", features = ["json"] }

# Base64 encoding (for beautify API)
base64 = "0.22"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Async / IPC
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "macros", "time"] }

# Internal crates
naive-core = { path = "crates/naive-core" }
naive-sim = { path = "crates/naive-sim" }
naive-client = { path = "crates/naive-client", default-features = false }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
